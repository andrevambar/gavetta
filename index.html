<style>
/* VOICE: calmo e sem ruído, como o TeuxDeux — mas com a profundidade de um Notion/Evernote.
   IDEA: um caderno de capa mole: barra lateral com cadernos e páginas, cada página uma folha limpa.
   PICTURE: a própria página aberta (texto, tarefas e ficheiros Google embutidos) ou o ficheiro Google em ecrã inteiro.
   COLOUR and TYPE: branco, tinta quase preta, cinza-papel na lateral, um vermelho-coral vivo; Figtree 900 nos títulos.
   LAYOUT: lateral 260px + página centrada a 760px; no telemóvel a lateral é o ecrã inicial e a página entra por cima. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#151515);--ink:light-dark(#1b1b1b,#eeeeee);--mute:light-dark(#8a8a8a,#8c8c8c);
--rule:light-dark(#ececea,#272727);--side:light-dark(#f7f7f5,#1b1b1b);--hov:light-dark(#ececea,#262626);
--acc:#ff4b3e;--acc2:light-dark(#fff0ee,#3a1714);
--doc:#3b7cf0;--sheet:#1e9e5a;--slides:#f0a81c;--drive:#7d7d7d;--pdf:#e04a3f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
[contenteditable]:focus{outline:none}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--mute);opacity:.6}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);height:100%}
/* lateral */
.side{background:var(--side);border-right:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden;
 padding:calc(env(safe-area-inset-top) + 14px) 10px calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 10px)}
.logo{font-weight:900;font-size:21px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;padding:2px 10px 12px}
.logo .mark{width:30px;height:28px;flex:none;margin:-4px 0}
.logo .sp{flex:1}
.nv{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:6px 10px;border-radius:8px;font-size:15px;text-align:left;color:var(--ink)}
.nv:hover{background:var(--hov)}
.nv.on{background:var(--hov);font-weight:700}
.r.dropin,.crumb a.dropin{background:var(--acc2);outline:2px dashed var(--acc);outline-offset:-2px;border-radius:8px}
.dragsrc{opacity:.45}
.ghost{position:fixed;left:0;top:0;z-index:20;pointer-events:none;display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:10px 14px;box-shadow:0 16px 40px #0003;font-weight:700;font-size:15px;max-width:260px;white-space:nowrap;overflow:hidden}
.r,.side .nv{-webkit-touch-callout:none}
.nv.dropin{background:var(--acc2);outline:2px dashed var(--acc);outline-offset:-2px}
.nv svg,.nv .fi{width:18px;height:18px;flex:none}
.nv .n{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nv kbd{font:12px Figtree;color:var(--mute)}
.nv .c{font-size:12px;color:var(--mute)}
.tw{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--mute);border-radius:4px;transition:transform .15s}
.tw:hover{background:var(--rule)}
.tw.open{transform:rotate(90deg)}
.sec{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--mute);font-weight:600;padding:18px 10px 4px}
.sec button{width:26px;height:26px;border-radius:6px;font-size:18px;line-height:1;color:var(--mute)}
.sec button:hover{background:var(--hov);color:var(--ink)}
.tree{overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px}
.kids{padding-left:14px}
.foot{border-top:1px solid var(--rule);padding-top:8px;display:flex;gap:6px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);padding:8px 10px;border-radius:99px;cursor:pointer;white-space:nowrap}
.pill:hover{background:var(--hov)}
.pill b{width:8px;height:8px;border-radius:50%;background:var(--sheet)}
.pill.off b{background:var(--acc)}
/* página */
.main{overflow-y:auto;position:relative;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;min-height:56px}
.crumb{flex:1;font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb a{color:inherit;text-decoration:none;cursor:pointer}.crumb a:hover{color:var(--ink)}
.ib{height:36px;min-width:36px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mute);padding:0 8px;font-size:14px;white-space:nowrap}
.ib:hover{background:var(--hov);color:var(--ink)}
.ib.on{color:var(--acc)}
.ib svg{width:19px;height:19px}
.back{display:none}
.page{width:100%;max-width:820px;margin:0 auto;padding:24px clamp(18px,5vw,56px) 120px}
h1.t{font-weight:900;font-size:clamp(32px,4.6vw,44px);line-height:1.08;letter-spacing:-.025em;margin:8px 0 6px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--side);font-size:13px;color:var(--ink);cursor:pointer;border:1px solid var(--rule)}
.chip.ok{color:var(--sheet)}.chip.pend{color:var(--slides)}
.chip b{width:7px;height:7px;border-radius:50%;background:currentColor}
.tag{color:var(--acc);font-weight:600}
/* blocos */
.blk{position:relative;margin:2px 0}
.blk .hand{position:absolute;left:-34px;top:4px;opacity:0;width:26px;height:26px;border-radius:6px;color:var(--mute);display:grid;place-items:center}
.blk:hover .hand{opacity:1}.blk .hand:hover{background:var(--hov)}
.p{min-height:28px;padding:3px 0;white-space:pre-wrap;font-size:17px;line-height:1.65}
.h{font-weight:800;font-size:24px;letter-spacing:-.01em;padding:14px 0 2px}
.todo{display:flex;gap:10px;align-items:flex-start;padding:3px 0}
.todo .x{transition:background .15s,border-color .15s;width:20px;height:20px;border-radius:50%;border:2px solid var(--rule);flex:none;margin-top:4px;display:grid;place-items:center}
.todo .x:hover{border-color:var(--mute)}
.todo.done .x{background:var(--sheet);border-color:var(--sheet)}
.todo.done .x::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.todo .tx{flex:1;font-size:17px;min-height:28px}
.todo.done .tx{color:light-dark(#c2c2bf,#5c5c5c)}
.card{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--bg)}
.card:hover{background:var(--side)}
.card .fi{width:28px;height:28px}
.card .cn{flex:1;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .cn small{display:block;font-weight:500;color:var(--mute);font-size:13px}
.embed{border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin:8px 0;height:520px;display:flex;flex-direction:column}
.embed webview,.embed .mock{flex:1}
.tgl{display:flex;gap:6px;align-items:flex-start}
.tgb{width:26px;height:26px;margin-top:4px;border-radius:6px;display:grid;place-items:center;color:var(--ink);flex:none;transition:transform .15s}
.tgb:hover{background:var(--hov)}
.tgl.open .tgb{transform:rotate(90deg)}
.tgs{flex:1;font-size:17px;font-weight:600;min-height:28px;padding:3px 0}
.tgc{margin:2px 0 8px 32px;padding:4px 0 4px 14px;border-left:2px solid var(--rule);font-size:17px;line-height:1.65;white-space:pre-wrap;min-height:30px}
.btn .bi{width:17px;height:17px;flex:none;color:var(--mute)}
.btn:hover .bi{color:var(--acc)}
.adder .sep{width:1px;align-self:stretch;background:var(--rule);margin:4px 6px}
.btn.gf .bi{color:var(--acc)}
.ghost{cursor:text;min-height:40px}
.adder{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;padding-top:14px;border-top:1px dashed var(--rule)}
.btn{height:40px;padding:0 14px;border-radius:10px;background:var(--side);font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-size:14px;border:1px solid var(--rule);white-space:nowrap}
.btn:hover{background:var(--hov)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.red{color:var(--acc)}
.inline{display:flex;gap:8px;margin:10px 0}
.inline input{flex:1;height:44px;border:1px solid var(--rule);border-radius:10px;padding:0 14px;font-size:16px;background:var(--bg)}
.subs h3,.home h3{font-size:13px;color:var(--mute);font-weight:700;margin:34px 0 6px}
/* lista do caderno */
.rows{border-top:1px solid var(--rule)}
.r{display:flex;gap:14px;align-items:flex-start;padding:14px 4px;border-bottom:1px solid var(--rule);cursor:pointer}
.r:hover{background:var(--side)}
.r .fi{width:22px;height:22px;margin-top:2px}
.r .rb{flex:1;overflow:hidden}
.r .rt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .rs{font-size:14px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r .rd{font-size:13px;color:var(--mute);white-space:nowrap;display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sheet)}.dot.p{background:var(--slides)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tile{border:1px solid var(--rule);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:8px;align-content:start;min-height:108px}
.tile:hover{background:var(--side)}
.tile .fi{width:28px;height:28px}
.btn .fi,.fi{width:18px;height:18px}
[hidden]{display:none!important}
.tile b{font-size:15px;line-height:1.3}
.tile small{color:var(--mute);font-size:13px}
.quick{display:flex;gap:8px;border:1px solid var(--rule);border-radius:14px;padding:6px 6px 6px 16px;align-items:center;background:var(--bg);box-shadow:0 6px 24px light-dark(#0000000a,#0000)}
.quick input{flex:1;border:0;background:none;height:44px;font-size:17px}
.quick select{border:0;background:var(--side);border-radius:8px;height:36px;padding:0 8px;font-size:14px;max-width:140px}
/* visualizador */
.viewer{flex:1;display:flex;flex-direction:column;min-height:0}
.viewer webview,.viewer iframe{flex:1;border:0;width:100%}
.mock{display:grid;place-items:center;background:var(--side);position:relative;min-height:420px}
.mock svg{width:min(560px,90%);height:auto}
.mock .cap{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(520px,92%);font-size:14px;color:var(--mute);background:var(--bg);padding:12px 14px;border-radius:10px;border:1px solid var(--rule);text-align:center}
.fullfile .main{overflow:hidden}

/* semana (estilo TeuxDeux) */
.week{flex:1;display:grid;grid-template-rows:minmax(0,1.1fr) minmax(0,1fr);min-height:0}
.band{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;overflow:hidden;border-top:1px solid var(--rule)}
.band.books{background:var(--side)}
.wnav{display:grid;place-items:center;color:var(--mute);font-size:24px}.wnav:hover{color:var(--acc)}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:26px;overflow-x:auto;padding:16px 6px 8px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.books .cols{grid-auto-columns:minmax(230px,280px)}
.col{display:flex;flex-direction:column;overflow:hidden;scroll-snap-align:start}
.col h2{margin:0;font-weight:900;font-size:28px;line-height:1.05;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px;white-space:nowrap;cursor:pointer}
.col h2 small{font-size:13px;font-weight:600;color:var(--mute);letter-spacing:0}
.col.today h2{color:var(--acc)}.col.past{opacity:.45}
.list{list-style:none;margin:8px 0 0;padding:0;overflow-y:auto;flex:1;background:repeating-linear-gradient(transparent 0 37px,var(--rule) 37px 38px)}
.list.over{outline:2px dashed var(--acc);outline-offset:-2px}
.it{display:flex;align-items:center;gap:8px;height:38px;font-size:15px;cursor:pointer}
.it.drag{opacity:.3}
.it .tt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.it .ck{width:18px;height:18px;border-radius:50%;border:2px solid var(--rule);flex:none;display:grid;place-items:center}
.it:hover .ck{border-color:var(--mute)}
.it.done .ck{background:var(--sheet);border-color:var(--sheet)}
.it.done .ck::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it.done .tt{color:light-dark(#c2c2bf,#5c5c5c)}
.add input{width:100%;border:0;background:none;height:38px;font-size:15px;padding:0}
.add input::placeholder{color:var(--mute);opacity:.6}
.weekv .main{overflow:hidden}

/* quadro (estilo FigJam) */
.board{flex:1;position:relative;overflow:hidden;touch-action:none;background-color:var(--bg);background-image:radial-gradient(circle,var(--rule) 1.3px,transparent 1.5px);cursor:grab;outline:none;min-height:300px}
.board.pan{cursor:grabbing}
.board.arrow,.board.arrow .cd{cursor:crosshair}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.links{position:absolute;left:-5000px;top:-5000px;width:10000px;height:10000px;pointer-events:none;color:var(--ink);overflow:visible}
.links .ln{stroke:currentColor;stroke-width:2;fill:none}
.links .hit{stroke:transparent;stroke-width:18;fill:none;pointer-events:stroke;cursor:pointer}
.links g.sel{color:var(--acc)}
.cd{position:absolute;user-select:none;-webkit-user-select:none;cursor:default;transition:left .28s cubic-bezier(.2,.8,.2,1),top .28s cubic-bezier(.2,.8,.2,1)}
.cd.dragging{transition:none}
.rsz{position:absolute;right:0;bottom:0;width:26px;height:26px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 0 55%,var(--mute) 55% 60%,transparent 60% 70%,var(--mute) 70% 75%,transparent 75%);opacity:.6;z-index:2}
.rsz:hover{opacity:1}
.cd.sel{outline:2px solid var(--acc);outline-offset:3px;z-index:3}
.rf.open{z-index:2}
.cd.from{outline:2px dashed var(--acc);outline-offset:3px}
.st{width:180px;min-height:150px;padding:14px 14px 16px;border-radius:3px;box-shadow:0 1px 2px #0002,0 10px 20px -10px #0004;color:#1b1b1b;font-size:16px;line-height:1.4;font-weight:500}
.btx{width:max-content;min-width:80px;max-width:420px;padding:4px 6px;font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1.15}
.rf{width:250px;display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--bg);border:1px solid var(--rule);border-radius:12px;box-shadow:0 8px 18px -12px #0005}
.rf .fi{width:26px;height:26px}.rf b{display:block;font-size:15px;line-height:1.25}.rf small{color:var(--mute);font-size:13px}
.cv{white-space:pre-wrap;outline:none;min-height:1.3em;overflow-wrap:anywhere}
.cv[contenteditable=true]{cursor:text;user-select:text;-webkit-user-select:text}
.btitle{position:absolute;left:18px;top:12px;z-index:3;font-weight:900;font-size:22px;letter-spacing:-.02em;background:var(--bg);padding:4px 10px;border-radius:10px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.tools{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:8px;z-index:4;max-width:calc(100% - 16px)}
.tb{display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:5px;box-shadow:0 12px 30px -12px #0004;max-width:100%;overflow-x:auto}
.tb button{height:40px;min-width:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink);padding:0 10px;font-size:14px;font-weight:600;white-space:nowrap;flex:none}
.tb button:hover{background:var(--side)}.tb button.on{background:var(--acc2);color:var(--acc)}
.tb .bi{width:20px;height:20px;color:inherit}
.tb .sep{width:1px;height:24px;background:var(--rule);margin:0 4px;flex:none}
.tb #zl{font-size:13px;color:var(--mute);min-width:46px;text-align:center;flex:none}
.tb .sw{width:28px;min-width:28px;height:28px;padding:0;border-radius:50%;margin:0 3px;border:2px solid transparent}
.tb .sw.on{border-color:var(--ink)}
.tb .red{color:var(--acc)}
.tb .hint{font-size:14px;color:var(--mute);padding:0 10px;white-space:nowrap}
.bempty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);pointer-events:none;font-size:15px;text-align:center;padding:20px}

.rf .rmeta{flex:1;min-width:0}

.rh{display:flex;gap:10px;align-items:center;padding:10px 10px 10px 14px;border-bottom:1px solid var(--rule);cursor:grab}
.rbody{height:400px;overflow:auto;touch-action:pan-y;cursor:auto;user-select:text;-webkit-user-select:text;display:flex;flex-direction:column;overscroll-behavior:contain}
.rbody>webview,.rbody>.mock{flex:1;min-height:400px}
.rbody .mock .cap{font-size:12px;bottom:10px}
.rpage{padding:14px 20px 20px;font-size:15px;line-height:1.55}
.rpage h4{margin:14px 0 2px;font-size:18px;font-weight:800;letter-spacing:-.01em}
.rpage p{margin:4px 0;white-space:pre-wrap}
.rpage .todo{padding:2px 0}.rpage .todo .tx{font-size:15px}.rpage .todo .x{width:17px;height:17px;margin-top:3px}
.rpage details{margin:4px 0}.rpage summary{font-weight:600;cursor:pointer}.rpage details div{padding:2px 0 2px 16px;border-left:2px solid var(--rule);margin-left:4px;white-space:pre-wrap}
.rpage .fl{display:flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--rule);border-radius:8px;margin:6px 0;font-weight:600}
.rpage .empty{color:var(--mute)}
/* modais */
.modal{position:fixed;inset:0;display:none;place-items:start center;padding:12vh 16px;background:#0005;z-index:8}
.modal.show{display:grid}
.box{width:min(620px,100%);background:var(--bg);border-radius:16px;box-shadow:0 30px 80px #0003;overflow:hidden}
.box>input{width:100%;border:0;border-bottom:1px solid var(--rule);background:none;padding:18px 20px;font-size:20px;font-weight:600}
.res{max-height:52vh;overflow-y:auto;padding:6px}
.res button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:10px;text-align:left;min-height:44px}
.res button.sel,.res button:hover{background:var(--side)}
.res .fi{width:18px;height:18px}
.res small{color:var(--mute);margin-left:auto;white-space:nowrap;font-size:13px}
.res .empty{padding:20px;color:var(--mute);text-align:center}
.set{padding:22px;display:grid;gap:14px}
.set h3{margin:0;font-size:24px;font-weight:900;letter-spacing:-.02em}
.note{font-size:14px;color:var(--mute);margin:0}
.field{display:grid;gap:6px}.field span{font-size:13px;color:var(--mute)}
.field input{border:1px solid var(--rule);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:16px}
.menu{position:fixed;z-index:9;background:var(--bg);border:1px solid var(--rule);border-radius:12px;box-shadow:0 16px 40px #0002;padding:6px;min-width:220px;display:none}
.menu.show{display:block}

.menu hr{border:0;border-top:1px solid var(--rule);margin:4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,180%);background:var(--ink);color:var(--bg);padding:10px 12px 10px 18px;border-radius:12px;display:flex;gap:14px;align-items:center;transition:transform .25s;z-index:10;font-size:15px;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.toast button{color:var(--acc);font-weight:800;padding:6px 8px}
@media(max-width:760px){
 .band{grid-template-columns:minmax(0,1fr)}.wnav{display:none}

 .week{grid-template-rows:minmax(0,1fr) minmax(0,.8fr)}

 .ib.txt span{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
{
const $=s=>document.querySelector(s);
const ELECTRON=/Electron/.test(navigator.userAgent);
const DAYN=['domingo','segunda','terça','quarta','quinta','sexta','sábado'],MON=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const now=()=>Date.now();
const ymd=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=h=>{const d=document.createElement('div');d.innerHTML=h||'';return d.textContent||''};
const TYPES={note:'Página',board:'Quadro',folder:'Pasta',doc:'Google Docs',sheet:'Google Sheets',slides:'Google Slides',drive:'Pasta do Drive',pdf:'PDF no Drive',link:'Link'};
const FILE=t=>['doc','sheet','slides','drive','pdf','link'].includes(t);
const ago=t=>{const m=(now()-t)/6e4;if(m<1)return'agora';if(m<60)return'há '+Math.round(m)+' min';if(m<1440)return'há '+Math.round(m/60)+' h';const d=new Date(t);return d.getDate()+' '+MON[d.getMonth()]};
const I={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>',
 star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4l-5.5 2.9 1-6.2L3 9.7l6.2-.9z"/></svg>',
 starf:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4l-5.5 2.9 1-6.2L3 9.7l6.2-.9z"/></svg>',
 book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>',
 more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M4.2 4.2l2.1 2.1m11.4 11.4 2.1 2.1M2 12h3m14 0h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 5-7 7 7 7"/></svg>',
 ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>',
 chev:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 6 6 6-6 6"/></svg>',
 grip:'<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>'};
const icon=t=>{
 const c={doc:'var(--doc)',sheet:'var(--sheet)',slides:'var(--slides)',drive:'var(--drive)',pdf:'var(--pdf)'}[t]||'var(--mute)';
 if(t==='drive')return`<svg class="fi" viewBox="0 0 20 20"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h4l2 2h7A1.5 1.5 0 0 1 18 7.5v7a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 2 14.5z" fill="${c}"/></svg>`;
 if(t==='link')return`<svg class="fi" viewBox="0 0 20 20" fill="none" stroke="${c}" stroke-width="2"><path d="M8.5 11.5a3 3 0 0 0 4.2 0l2.6-2.6a3 3 0 0 0-4.2-4.2l-.9.9M11.5 8.5a3 3 0 0 0-4.2 0l-2.6 2.6a3 3 0 0 0 4.2 4.2l.9-.9"/></svg>`;
 if(t==='folder')return`<svg class="fi" viewBox="0 0 20 20" fill="none" stroke="var(--mute)" stroke-width="1.7" stroke-linejoin="round"><path d="M2.5 5.5A1.5 1.5 0 0 1 4 4h3.5l2 2H16a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 16 16H4a1.5 1.5 0 0 1-1.5-1.5z"/></svg>`;
 if(t==='board')return`<svg class="fi" viewBox="0 0 20 20" fill="none" stroke="var(--mute)" stroke-width="1.7"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><rect x="5.5" y="6.5" width="4.5" height="4.5" rx=".6" fill="var(--acc)" stroke="none"/><path d="M11.5 13.5h3.5M12.5 8.5l2 2"/></svg>`;
 if(t==='note'||t==='journal')return`<svg class="fi" viewBox="0 0 20 20" fill="none" stroke="${c}" stroke-width="1.8"><path d="M5 2.5h7l3.5 3.5v11.5H5z"/><path d="M8 10h5M8 13h4"/></svg>`;
 const inner={doc:'<path d="M7 9h6M7 12h6M7 15h4" stroke="#fff" stroke-width="1.6"/>',sheet:'<path d="M6 9h8v6H6zM10 9v6M6 12h8" stroke="#fff" stroke-width="1.4" fill="none"/>',slides:'<rect x="6" y="9" width="8" height="5" fill="none" stroke="#fff" stroke-width="1.6"/>',pdf:'<path d="M7 11h6M7 14h6" stroke="#fff" stroke-width="1.6"/>'}[t]||'';
 return`<svg class="fi" viewBox="0 0 20 20"><path d="M4 2h8l4 4v12H4z" fill="${c}"/><path d="M12 2v4h4" fill="#fff" opacity=".45"/>${inner}</svg>`};
const detect=s=>{
 const m=String(s).match(/https?:\/\/\S+/);if(!m)return null;const u=m[0];
 const t=/docs\.google\.com\/document/.test(u)?'doc':/docs\.google\.com\/spreadsheets/.test(u)?'sheet':/docs\.google\.com\/presentation/.test(u)?'slides':/drive\.google\.com\/drive\/(u\/\d+\/)?folders/.test(u)?'drive':/\.pdf|drive\.google\.com\/file/.test(u)?'pdf':'link';
 return{type:t,url:u,title:s.replace(u,'').trim()||TYPES[t]+' sem título'}};

/* ---------- dados ---------- */
const KEY='cerebro.v2';
function sample(){
 const g='https://docs.google.com/',t=now(),H=36e5;
 const nb=[{id:'n1',name:'Projetos',open:true},{id:'n2',name:'Finanças',open:true},{id:'n3',name:'Casa'},{id:'n4',name:'Ideias'}];
 const P=(o)=>Object.assign({id:uid(),parent:null,blocks:[],offline:false,sync:'ok',pinned:false,upd:t},o);
 const kick=P({id:'k1',nb:'n1',type:'note',title:'Reunião de arranque — Atlas',pinned:true,offline:true,upd:t-2*H,blocks:[
  {k:'p',v:'Objetivo: lançar a primeira versão em março. Equipa de 4 pessoas. #trabalho'},
  {k:'toggle',v:'Contexto do cliente',c:'Empresa de logística com 40 pessoas. Querem substituir folhas soltas por um painel único.',open:false},
  {k:'h',v:'Decisões'},
  {k:'p',v:'O orçamento fica na folha partilhada e o plano no documento principal. Revemos tudo à sexta.'},
  {k:'file',url:g+'document/d/demo1/edit',type:'doc',title:'Plano do projeto Atlas'},
  {k:'file',url:g+'spreadsheets/d/demo2/edit',type:'sheet',title:'Cronograma e orçamento'},
  {k:'h',v:'Próximos passos'},
  {k:'todo',v:'Enviar resumo à equipa',d:true},{k:'todo',v:'Marcar sessão com o cliente',d:false},{k:'todo',v:'Rever riscos do cronograma',d:false}]});
 const dd=new Date();
 return{nb,items:[
  kick,
  P({id:'j:'+ymd(t),nb:null,type:'journal',title:`${DAYN[dd.getDay()][0].toUpperCase()+DAYN[dd.getDay()].slice(1)}, ${dd.getDate()} de ${MON[dd.getMonth()]}`,offline:true,blocks:[{k:'p',v:'Dia de fechar o orçamento. #trabalho'},{k:'todo',v:'Enviar orçamento revisto à Marta',d:false},{k:'todo',v:'Ligar ao canalizador',d:true},{k:'todo',v:'Comprar presente para o Rui',d:false}]}),
  P({nb:'n1',parent:'k1',type:'note',title:'Notas do cliente',upd:t-5*H,blocks:[{k:'p',v:'Querem relatórios mensais e acesso ao cronograma.'}]}),
  P({nb:'n1',type:'doc',title:'Plano do projeto Atlas',url:g+'document/d/demo1/edit',offline:true,pinned:true,upd:t-3*H}),
  P({nb:'n1',type:'sheet',title:'Cronograma e orçamento',url:g+'spreadsheets/d/demo2/edit',offline:true,upd:t-26*H}),
  P({nb:'n1',type:'drive',title:'Entregáveis',url:'https://drive.google.com/drive/folders/demo3',upd:t-50*H}),

  P({nb:'n2',type:'sheet',title:'Despesas mensais 2026',url:g+'spreadsheets/d/demo5/edit',offline:true,pinned:true,upd:t-8*H}),
  P({nb:'n2',type:'pdf',title:'IRS 2025 — comprovativo',url:'https://drive.google.com/file/d/demo6/view',offline:true,upd:t-200*H}),
  P({nb:'n2',type:'note',title:'Ideias para poupar',upd:t-30*H,blocks:[{k:'p',v:'Pequenas mudanças com impacto ao fim do ano. #finanças'},{k:'todo',v:'Renegociar o tarifário da internet',d:false},{k:'todo',v:'Cancelar subscrições que não uso',d:true},{k:'todo',v:'Comparar seguros da casa',d:false}]}),
  P({nb:'n3',type:'doc',title:'Manual da casa — garantias e contactos',url:g+'document/d/demo7/edit',offline:true,upd:t-90*H}),
  P({nb:'n3',type:'drive',title:'Faturas e recibos',url:'https://drive.google.com/drive/folders/demo8',upd:t-120*H}),
  P({nb:'n4',type:'note',title:'Livro: produtividade calma',upd:t-12*H,blocks:[{k:'p',v:'Um único sítio para tudo. Menos ferramentas, mais atenção.'},{k:'h',v:'Capítulos'},{k:'p',v:'1. Menos é mais\n2. O caderno como casa\n3. O ritual de sexta'}]}),
 ]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.items)S=sample();
const sig=()=>{const{savedAt,...r}=S;return JSON.stringify(r)};
let lastSig=null,pushT=null;
const save=()=>{const j=sig();if(lastSig!==null&&j!==lastSig){S.savedAt=Date.now();if(window.gSync)gSync.schedule()}lastSig=j;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let route={v:'home'},online=navigator.onLine,undo=null,onlyOff=false;

 const prev=S.items.filter(x=>x.type==='journal'&&x.id<id).sort((a,b)=>a.id<b.id?1:-1)[0];

/* ---------- lateral ---------- */
function treeRows(nbId,parent,depth){
 return S.items.filter(i=>i.nb===nbId&&i.parent===parent&&(!onlyOff||i.offline||i.type==='folder')).sort((a,b)=>(b.type==='folder')-(a.type==='folder')).map(i=>{

function renderSide(){
 $('#side').innerHTML=`<div class="logo"><svg class="mark" viewBox="10 14 80 74" aria-hidden="true"> <path d="M17 57 L23.5 45 H76.5 L83 57 Z" fill="var(--rule)"/> <g fill="#ff4b3e"> <circle cx="32" cy="45" r="11"/><circle cx="39.5" cy="32.5" r="12"/><circle cx="50" cy="28.5" r="12.5"/> <circle cx="60.5" cy="32.5" r="12"/><circle cx="68" cy="45" r="11"/><rect x="25" y="38" width="50" height="20"/> </g> <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M50 20.5 C47 26 53 30 50 35.5 C47 41 53 45 50 52"/><path d="M29 41.5 C32.5 40.5 35 42.5 35.6 45.8"/><path d="M71 41.5 C67.5 40.5 65 42.5 64.4 45.8"/><path d="M39 26 C42 27 43.5 29.5 43 32.5"/><path d="M61 26 C58 27 56.5 29.5 57 32.5"/></g> <rect x="13" y="55" width="74" height="29" rx="8" fill="var(--ink)"/> <rect x="40" y="66.5" width="20" height="6" rx="3" fill="var(--bg)"/> </svg>gavetta<span class="sp"></span><button class="ib" data-act="settings" aria-label="Definições">${I.gear}</button></div>
 <button class="nv" data-act="search">${I.search}<span class="n">Pesquisar</span><kbd>⌘K</kbd></button>
 <button class="nv${route.v==='home'?' on':''}" data-go="home">${I.home}<span class="n">Início</span></button>
 <button class="nv${route.v==='item'&&route.id&&route.id.startsWith('j:')?' on':''}" data-go="journal">${I.cal}<span class="n">Hoje</span></button>
 <button class="nv${route.v==='week'?' on':''}" data-go="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg><span class="n">Semana</span></button>

 $('#mSet').classList.add('show');
 const gi=$('#gin');if(gi)gi.onclick=async()=>{try{await gSync.connect(true);openSet()}catch(e){$('#connMsg').textContent='Não foi possível ligar: '+(e&&e.type||e&&e.error||'tenta outra vez')}};
 const go_=$('#gout');if(go_)go_.onclick=()=>{gSync.disconnect();openSet()};
 const gn=$('#gsyncnow');if(gn)gn.onclick=async()=>{await gSync.pull(true);openSet()};
 $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S,null,1));toast('Dados copiados',false)}catch(e){toast('Não foi possível copiar aqui',false)}};
 $('#reset').onclick=()=>{const old=S;S=sample();seedBoard();seedFolders();undo=()=>{S=old;render()};$('#mSet').classList.remove('show');go('home');toast('Exemplo reposto')}}

/* ---------- Google Drive ---------- */
window.gSync=(()=>{
 const CID='657650752825-c2a5vcjtjpo00qec5sev11g9f1bimrrn.apps.googleusercontent.com';
 const SCOPES='https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.appdata';
 const API='https://www.googleapis.com/drive/v3',UP='https://www.googleapis.com/upload/drive/v3';
 let tok=null,exp=0,tc=null,fileId=null,email='',last=0,on=false,t=null,busy=false;
 const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(KEY+'.'+k);if(v===null)localStorage.removeItem(KEY+'.'+k);else localStorage.setItem(KEY+'.'+k,v)}catch(e){}};
 const gis=()=>new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.onload=()=>res();sc.onerror=rej;document.head.appendChild(sc)});
 async function token(interactive){if(tok&&Date.now()<exp-60000)return tok;await gis();return new Promise((res,rej)=>{
  tc=google.accounts.oauth2.initTokenClient({client_id:CID,scope:SCOPES,hint:email||undefined,callback:r=>{if(r.error)return rej(r);tok=r.access_token;exp=Date.now()+r.expires_in*1000;res(tok)},error_callback:e=>rej(e)});
  tc.requestAccessToken({prompt:interactive?'':'none'})})}
 async function api(url,opt={},interactive=false){const tk=await token(interactive);const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+tk}});if(r.status===401){tok=null;return api(url,opt,interactive)}if(!r.ok)throw new Error('Drive '+r.status);return r}
 async function findFile(){if(fileId)return fileId;const r=await (await api(`${API}/files?spaces=appDataFolder&q=${encodeURIComponent("name='gavetta.json'")}&fields=files(id,modifiedTime)`)).json();fileId=r.files&&r.files[0]&&r.files[0].id||null;return fileId}
 async function push(){if(!on||!online||busy)return;busy=true;try{const id=await findFile(),body=JSON.stringify(S);
   if(id)await api(`${UP}/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
   else{const b='gvt'+Date.now(),m=JSON.stringify({name:'gavetta.json',parents:['appDataFolder']});const r=await (await api(`${UP}/files?uploadType=multipart&fields=id`,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:`--${b}\r\nContent-Type: application/json\r\n\r\n${m}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`})).json();fileId=r.id}
   last=Date.now();S.items.forEach(i=>{if(i.sync==='pending')i.sync='ok'});lastSig=null;save();renderSide()}catch(e){console.warn(e)}finally{busy=false}}
 async function pull(force){if(!on||!online)return;try{const id=await findFile();if(!id){await push();return}
   const remote=await (await api(`${API}/files/${id}?alt=media`)).json(),first=!ls('synced');
   if(remote&&remote.items&&(first||(remote.savedAt||0)>(S.savedAt||0))){if(first)ls('bak',JSON.stringify(S));S=remote;lastSig=null;save();ls('synced','1');last=Date.now();render();if(first)toast('Carreguei os teus dados do Drive',false)}
   else{ls('synced','1');if(force||(S.savedAt||0)>(remote.savedAt||0))await push();else last=Date.now()}}catch(e){console.warn(e)}}
 async function connect(interactive){await token(interactive);on=true;ls('g','1');try{const a=await (await api(`${API}/about?fields=user(emailAddress)`)).json();email=a.user.emailAddress;ls('email',email)}catch(e){}await pull();renderSide()}
 function disconnect(){try{if(tok&&window.google)google.accounts.oauth2.revoke(tok)}catch(e){}tok=null;on=false;fileId=null;ls('g',null);renderSide()}
 const schedule=()=>{if(!on)return;clearTimeout(t);t=setTimeout(push,2000)};
 async function search(q){const qq=`trashed=false and mimeType!='application/vnd.google-apps.shortcut'`+(q?` and name contains '${q.replace(/['\\]/g,'\\$&')}'`:'');
  const r=await (await api(`${API}/files?q=${encodeURIComponent(qq)}&orderBy=modifiedTime desc&pageSize=25&fields=files(id,name,mimeType,webViewLink,modifiedTime)&supportsAllDrives=true&includeItemsFromAllDrives=true`,{},true)).json();return r.files||[]}
 email=ls('email')||'';
 if(HOSTED&&ls('g'))setTimeout(()=>connect(false).catch(()=>{on=false;renderSide()}),300);
 addEventListener('focus',()=>{if(on&&Date.now()-last>15000)pull()});
 return{connect,disconnect,schedule,pull:f=>pull(f),push,search,state:()=>({on,email,last})}})();

/* ---------- procurar no Drive ---------- */
const MIME={'application/vnd.google-apps.document':'doc','application/vnd.google-apps.spreadsheet':'sheet','application/vnd.google-apps.presentation':'slides','application/vnd.google-apps.folder':'drive','application/pdf':'pdf'};
let dHits=[],dDest=null,dT=null;
function openDrive(dest){dDest=dest;if(!HOSTED){toast('Procurar no Drive funciona quando a gavetta estiver no teu endereço',false);return}
 $('#mDrive').classList.add('show');$('#dq').value='';$('#dres').innerHTML='<div class="empty">A carregar os teus ficheiros recentes…</div>';$('#dq').focus();runDrive()}
async function runDrive(){try{if(!gSync.state().on)await gSync.connect(true);dHits=await gSync.search($('#dq').value.trim());
 $('#dres').innerHTML=dHits.length?dHits.map((f,k)=>`<button data-dk="${k}">${icon(MIME[f.mimeType]||'link')}<span>${esc(f.name)}</span><small>${ago(Date.parse(f.modifiedTime))}</small></button>`).join(''):'<div class="empty">Nada encontrado.</div>'}
 catch(e){$('#dres').innerHTML='<div class="empty">Não foi possível ligar ao Drive. Tenta outra vez.</div>'}}
$('#dq').oninput=()=>{clearTimeout(dT);dT=setTimeout(runDrive,350)};
$('#dres').onclick=e=>{const b=e.target.closest('[data-dk]');if(!b)return;const f=dHits[+b.dataset.dk],d=dDest||{nb:S.nb[0].id,par:null};
 if(S.items.some(i=>i.url===f.webViewLink&&i.nb===d.nb)){toast('Esse ficheiro já está aqui',false);return}
 S.items.push({id:uid(),nb:d.nb,parent:d.par||null,type:MIME[f.mimeType]||'link',title:f.name,url:f.webViewLink,blocks:[],offline:false,sync:online?'ok':'pending',pinned:false,upd:now()});
 render();toast('Adicionado: '+f.name,false)};

/* ---------- online / offline ---------- */
function net(v){online=v;render();if(v&&window.gSync&&gSync.state().on){gSync.pull();return}
 if(v){const p=S.items.filter(i=>i.sync==='pending');if(p.length){toast(`A sincronizar ${p.length} alteraç${p.length>1?'ões':'ão'} com o Drive…`,false);setTimeout(()=>{p.forEach(i=>i.sync='ok');render();toast('Tudo sincronizado',false)},1400)}}
 else toast('Sem rede — continua a escrever, sincronizo depois',false)}
addEventListener('online',()=>net(true));addEventListener('offline',()=>net(false));
if(HOSTED&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(innerWidth<=760)$('#app').dataset.pane='side';
render();
}
</script>
